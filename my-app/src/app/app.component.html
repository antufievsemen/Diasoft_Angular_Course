<div>
    <div>
        <app-loading *ngIf="isLoad()"></app-loading>
    </div>

    <div *ngIf="!isLoad()">
        <app-header></app-header>
        <div *ngIf="isAuthenticated()">
            <p-toast />
            <p-confirmDialog></p-confirmDialog>
            <router-outlet></router-outlet>
        </div>
        <div *ngIf="!isAuthenticated()">
            <app-login (auth)="login($event)"></app-login>
        </div>
        <app-footer></app-footer>
    </div>


</div>
