<div>
    <div class="login-form">
        <div class="flex flex-col gap-2">
            <label class="r-2px" for="username">Username</label>
            <input pInputText id="username" type="text" [(ngModel)]="email" />
        </div>
        <div class="flex flex-col gap-2">
            <label class="r-2px" for="password">Password</label>
            <input pInputText id="password" type="password" [(ngModel)]="password" />
        </div>
        <div class="flex">
            <p-button (onClick)="login()" label="Login" icon="pi pi-user" class="w-full max-w-[17.35rem]"
                styleClass="w-full mx-auto" />
        </div>
    </div>
</div>
